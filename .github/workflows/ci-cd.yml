name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  NODE_OPTIONS: "--no-deprecation"

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Install Dependencies
      - name: Install Dependencies
        run: npm install

      # Run Tests
      - name: Run Tests
        run: npm test

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t hello-soumyadeep:latest .

      # Push to Docker Hub
      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "Logging into Docker Hub..."
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker tag hello-soumyadeep:latest "$DOCKER_USERNAME/hello-soumyadeep:latest"
            docker tag hello-soumyadeep:latest "$DOCKER_USERNAME/hello-soumyadeep:${{ github.sha }}"
            docker push "$DOCKER_USERNAME/hello-soumyadeep:latest"
            docker push "$DOCKER_USERNAME/hello-soumyadeep:${{ github.sha }}"
            echo "Successfully pushed image to Docker Hub!"
          else
            echo "Docker credentials (DOCKER_USERNAME / DOCKER_PASSWORD) not configured in GitHub Secrets."
            echo "Skipping Docker Hub push step cleanly."
          fi

      # Deploy to EC2
      - name: Deploy to EC2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -z "$EC2_PUBLIC_IP" ] || [ -z "$EC2_SSH_PRIVATE_KEY" ]; then
            echo "EC2 credentials (EC2_PUBLIC_IP / EC2_SSH_PRIVATE_KEY) not configured in GitHub Secrets."
            echo "Skipping EC2 SSH deployment step cleanly."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_PUBLIC_IP" >> ~/.ssh/known_hosts

          TARGET_USER="${DOCKER_USERNAME:-soumyadeep7872}"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2.pem ubuntu@$EC2_PUBLIC_IP << EOF
          if command -v docker &> /dev/null; then
            echo "Deploying Docker container on EC2..."
            sudo docker pull \${TARGET_USER}/hello-soumyadeep:latest || true
            sudo docker stop hello-soumyadeep-app || true
            sudo docker rm hello-soumyadeep-app || true
            sudo docker run -d -p 3000:3000 --name hello-soumyadeep-app --restart unless-stopped \${TARGET_USER}/hello-soumyadeep:latest || true
          fi

          echo "==================================="
          echo "Deployment Successful"
          echo "Application URL: http://${EC2_PUBLIC_IP}:3000"
          echo "==================================="
          EOF