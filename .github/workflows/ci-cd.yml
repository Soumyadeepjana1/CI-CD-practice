name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Install Dependencies hello
      - name: Install Dependencies
        run: npm install

      # Run Tests
      - name: Run Tests
        run: npm test

      # Deploy to EC2
      - name: Deploy to EC2
        if: |
          github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
          && secrets.EC2_PUBLIC_IP != ''
          && secrets.EC2_SSH_PRIVATE_KEY != ''
        env:
          HOST: ${{ secrets.EC2_PUBLIC_IP }}
        run: |

          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2.pem

          chmod 600 ~/.ssh/ec2.pem

          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2.pem ubuntu@$HOST << EOF

          # Install Node.js if not present
          if ! command -v node &> /dev/null
          then
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi

          # Install npm and express
          sudo npm install -g express

          # Create application directory
          sudo mkdir -p /app
          cd /app

          # Create the application file
          sudo tee index.js > /dev/null << 'EOL'
          const express = require('express');
          const app = express();
          app.get('/', (req, res) => {
            res.send('hello soumyadeep');
          });
          app.listen(3000, () => {
            console.log('Server running on port 3000');
          });
          EOL

          # Stop existing process if running
          pkill -f "node index.js" || true

          # Start the application in background
          nohup sudo node index.js > /app/app.log 2>&1 &

          echo "==================================="
          echo "Deployment Successful"
          echo "Application URL:"
          echo "http://72.44.40.216:3000"
          echo "==================================="

          EOF