name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--no-deprecation"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js Environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Run Automated Tests
      - name: Run Tests
        run: npm test

      # 5. Deploy to AWS EC2 Instance
      - name: Deploy to EC2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP || '72.44.40.216' }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$EC2_SSH_PRIVATE_KEY" ]; then
            echo "EC2_SSH_PRIVATE_KEY secret is not set in GitHub Secrets."
            echo "Skipping EC2 deployment step cleanly."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_PUBLIC_IP" >> ~/.ssh/known_hosts

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2.pem ubuntu@$EC2_PUBLIC_IP << 'EOF'
          echo "Deploying Node.js application to EC2..."

          if ! command -v node &> /dev/null; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi

          sudo mkdir -p /var/www/hello-soumyadeep
          sudo chown -R ubuntu:ubuntu /var/www/hello-soumyadeep
          cd /var/www/hello-soumyadeep

          pkill -f "node index.js" || true

          cat << 'APP_CODE' > index.js
          const express = require('express');
          const app = express();
          const port = process.env.PORT || 3000;

          app.get('/', (req, res) => {
            res.status(200).json({
              status: 'success',
              message: 'Hello Soumyadeep! Direct Node.js CI/CD Pipeline Working Successfully!',
              timestamp: new Date().toISOString()
            });
          });

          app.get('/health', (req, res) => {
            res.status(200).json({ status: 'UP' });
          });

          app.listen(port, () => {
            console.log(`Server running on port ${port}`);
          });
          APP_CODE

          cat << 'PKG_CODE' > package.json
          {
            "name": "hello-soumyadeep",
            "version": "1.0.0",
            "main": "index.js",
            "dependencies": {
              "express": "^4.19.2"
            }
          }
          PKG_CODE

          npm install --production
          nohup node index.js > app.log 2>&1 &

          echo "==================================="
          echo "Deployment Successful!"
          echo "Application URL: http://72.44.40.216:3000"
          echo "==================================="
          EOF