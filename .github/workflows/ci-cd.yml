name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: hello-soumyadeep:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Run Docker container
      run: docker run -d -p 3000:3000 --name app hello-soumyadeep:${{ github.sha }}
    
    - name: Test application
      run: |
        sleep 5
        curl -f http://localhost:3000 || exit 1
    
    - name: Stop container
      run: docker stop app

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:latest
          ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Image digest
      run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

  deploy-to-ec2:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
        chmod 600 ~/.ssh/ec2_key
        ssh-keyscan -H ${{ secrets.EC2_PUBLIC_IP }} >> ~/.ssh/known_hosts
    
    - name: Deploy to EC2
      run: |
        ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
          # Pull latest image
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:latest
          
          # Stop and remove existing container
          sudo docker stop hello-soumyadeep-app 2>/dev/null || true
          sudo docker rm hello-soumyadeep-app 2>/dev/null || true
          
          # Run new container
          sudo docker run -d -p 3000:3000 --name hello-soumyadeep-app --restart unless-stopped ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:latest
          
          # Clean up old images
          sudo docker image prune -af
        EOF
    
    - name: Verify deployment
      run: |
        sleep 10
        curl -f http://${{ secrets.EC2_PUBLIC_IP }}:3000 || exit 1
