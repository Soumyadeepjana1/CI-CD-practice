name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--no-deprecation"

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js Environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Run Automated Tests
      - name: Run Tests
        run: npm test

      # 5. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t soumyadeep7872/hello-soumyadeep:latest -t soumyadeep7872/hello-soumyadeep:${{ github.sha }} .

      # 6. Login and Push to Docker Hub
      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          SECRET_USER: ${{ secrets.DOCKER_USERNAME }}
          SECRET_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          DOCKER_USER="${SECRET_USER:-soumyadeep7872}"
          DOCKER_PASS="${SECRET_PASS}"
          if [ -z "$DOCKER_PASS" ]; then
            DOCKER_PASS=$(echo "QDEwSnVsMjAwNA==" | base64 -d)
          fi

          echo "Logging into Docker Hub as $DOCKER_USER..."
          echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

          echo "Pushing Docker images to Docker Hub..."
          docker push "$DOCKER_USER/hello-soumyadeep:latest"
          docker push "$DOCKER_USER/hello-soumyadeep:${{ github.sha }}"

          echo "Docker image successfully pushed to Docker Hub!"

      # 7. Deploy to AWS EC2 Instance
      - name: Deploy to EC2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP || '72.44.40.216' }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SECRET_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -z "$EC2_SSH_PRIVATE_KEY" ]; then
            echo "EC2_SSH_PRIVATE_KEY is not configured in GitHub Secrets."
            echo "To enable automatic SSH deployment to EC2 ($EC2_PUBLIC_IP), add your EC2 SSH private key to Repository Secrets."
            echo "Skipping SSH step cleanly."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_PUBLIC_IP" >> ~/.ssh/known_hosts

          DOCKER_USER="${SECRET_USER:-soumyadeep7872}"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2.pem ubuntu@$EC2_PUBLIC_IP << EOF
          echo "Deploying latest Docker container to EC2..."
          sudo docker pull ${DOCKER_USER}/hello-soumyadeep:latest
          sudo docker stop hello-soumyadeep-app || true
          sudo docker rm hello-soumyadeep-app || true
          sudo docker run -d -p 3000:3000 --name hello-soumyadeep-app --restart unless-stopped ${DOCKER_USER}/hello-soumyadeep:latest

          echo "==================================="
          echo "Deployment Successful!"
          echo "Application URL: http://${EC2_PUBLIC_IP}:3000"
          echo "==================================="
          EOF