name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Install Dependencies hello
      - name: Install Dependencies
        run: npm install

      # Run Tests
      - name: Run Tests
        run: npm test

      # Docker Login
      - name: Login to Docker Hub
        if: |
          github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "Docker credentials not configured - skipping Docker push"
            echo "To enable Docker push, add DOCKER_USERNAME and DOCKER_PASSWORD secrets"
            exit 0
          fi
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      # Build & Push Docker Image
      - name: Build and Push Docker Image
        if: |
          github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "Docker credentials not configured - skipping Docker push"
            exit 0
          fi
          docker build -t $DOCKER_USERNAME/hello-soumyadeep:latest .
          docker build -t $DOCKER_USERNAME/hello-soumyadeep:${{ github.sha }} .
          docker push $DOCKER_USERNAME/hello-soumyadeep:latest
          docker push $DOCKER_USERNAME/hello-soumyadeep:${{ github.sha }}

      # Deploy to EC2
      - name: Deploy to EC2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          HOST: ${{ secrets.EC2_PUBLIC_IP }}
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2.pem

          chmod 600 ~/.ssh/ec2.pem

          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2.pem ubuntu@$HOST << EOF

          if ! command -v docker &> /dev/null
          then
            curl -fsSL https://get.docker.com | sudo sh
            sudo usermod -aG docker ubuntu
          fi

          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:latest

          sudo docker stop hello-soumyadeep-app || true

          sudo docker rm hello-soumyadeep-app || true

          sudo docker run -d \
            --name hello-soumyadeep-app \
            --restart unless-stopped \
            -p 3000:3000 \
            ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:latest

          sudo docker image prune -f

          echo "==================================="

          echo "Deployment Successful"

          echo "Application URL:"
          echo "http://72.44.40.216:3000"

          echo "==================================="

          EOF