name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Install Dependencies hello
      - name: Install Dependencies
        run: npm install

      # Run Tests
      - name: Run Tests
        run: npm test

      # Docker Login
      - name: Login to Docker Hub
        if: |
          github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
          && secrets.DOCKER_USERNAME != ''
          && secrets.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & Push Docker Image
      - name: Build and Push Docker Image
        if: |
          github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
          && secrets.DOCKER_USERNAME != ''
          && secrets.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:latest
            ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:${{ github.sha }}

      # Deploy to EC2
      - name: Deploy to EC2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          HOST: ${{ secrets.EC2_PUBLIC_IP }}
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2.pem

          chmod 600 ~/.ssh/ec2.pem

          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2.pem ubuntu@$HOST << EOF

          if ! command -v docker &> /dev/null
          then
            curl -fsSL https://get.docker.com | sudo sh
            sudo usermod -aG docker ubuntu
          fi

          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:latest

          sudo docker stop hello-soumyadeep-app || true

          sudo docker rm hello-soumyadeep-app || true

          sudo docker run -d \
            --name hello-soumyadeep-app \
            --restart unless-stopped \
            -p 3000:3000 \
            ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:latest

          sudo docker image prune -f

          echo "==================================="

          echo "Deployment Successful"

          echo "Application URL:"
          echo "http://72.44.40.216:3000"

          echo "==================================="

          EOF