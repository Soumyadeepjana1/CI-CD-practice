name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run tests
      run: npm test
    
    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:latest
          ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:${{ github.sha }}
    
    - name: Deploy to EC2
      if: |
        github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        && secrets.EC2_PUBLIC_IP != ''
        && secrets.EC2_SSH_PRIVATE_KEY != ''
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
        chmod 600 ~/.ssh/ec2_key
        ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:latest
          sudo docker stop hello-soumyadeep-app 2>/dev/null || true
          sudo docker rm hello-soumyadeep-app 2>/dev/null || true
          sudo docker run -d -p 3000:3000 --name hello-soumyadeep-app --restart unless-stopped ${{ secrets.DOCKER_USERNAME }}/hello-soumyadeep:latest
          echo "Deployment completed on EC2 instance"
          echo "Public IP: 72.44.40.216"
          echo "Private IP: 172.31.34.110"
          echo "Public DNS: ec2-72-44-40-216.compute-1.amazonaws.com"
        EOF
